[project]
name = "power-market-analytics"
version = "0.1.0"
description = "Energy Demand & Price Analytics Warehouse with PostgreSQL star schema, idempotent Python ETL, and analytical SQL"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
